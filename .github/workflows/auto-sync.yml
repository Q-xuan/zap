# 自动同步上游 zerx-lab/zap → Q-xuan/zap,并在上游发新 tag 时触发 Windows build。
#
# 设计要点:
#   - 频率:cron `0 */6 * * *`(每 6 小时)+ 手动 workflow_dispatch
#   - build 触发条件:仅当上游有 Q-xuan/zap 还没有的最新 tag
#   - 自己的 commit 处理:rebase 到 upstream/main 之上,历史线性
#
# v2 关键修复:
#   - tag 比较改用 `git ls-remote --tags origin`(查远程真实状态),不用本地
#     `git tag`(被 checkout 的 fetch-depth:0 污染,会拿到 upstream 的 tag);
#   - push 拆成「只在 main 变了才 force-with-lease push」+「只推具体的新 tag」,
#     不再用 `git push --tags` 全量推,避免 upstream 中指向非 main commit 的 tag
#     push 失败拖垮整步。

name: Auto Sync upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 即使没新 tag 也强制跑一次 build(测试用)
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: zerx-lab/zap
  UPSTREAM_BRANCH: main

jobs:
  sync:
    name: Sync upstream + detect new tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.check_tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}" --tags --prune --no-recurse-submodules

      # 关键:用 ls-remote 查 origin 远程真实的 tag 集合,
      # 不能用本地 `git tag`(checkout 的 fetch-depth:0 已把 upstream tag 拉到本地)。
      - name: Detect new upstream tag
        id: check_tag
        run: |
          set -uo pipefail
          ORIGIN_TAGS=$(git ls-remote --tags --refs origin \
                        | awk -F'\t' '{print $2}' \
                        | sed 's|^refs/tags/||' \
                        | sort -u)
          echo "::notice::origin 上 tag 数: $(echo "$ORIGIN_TAGS" | grep -c . || true)"

          UPSTREAM_TAG=$(git tag --sort=-creatordate \
                        --merged "upstream/${UPSTREAM_BRANCH}" \
                        | head -n1 || true)
          echo "::notice::upstream 最新 tag: ${UPSTREAM_TAG:-<none>}"

          NEW_TAG=""
          if [[ -n "${UPSTREAM_TAG}" ]] && ! grep -qxF "${UPSTREAM_TAG}" <<<"${ORIGIN_TAGS}"; then
            NEW_TAG="${UPSTREAM_TAG}"
            echo "::notice::检测到上游新 tag ${NEW_TAG} → 将同步 + 触发 build"
          else
            echo "::notice::无新 tag(origin 已有 ${UPSTREAM_TAG:-<none>})"
          fi
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Rebase local main onto upstream/main
        id: rebase
        run: |
          set -uo pipefail
          git checkout "${UPSTREAM_BRANCH}"
          BEFORE=$(git rev-parse HEAD)
          UPSTREAM_HEAD=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          ORIGIN_HEAD=$(git rev-parse "origin/${UPSTREAM_BRANCH}")
          echo "::notice::before(local main)=${BEFORE:0:9}  upstream/main=${UPSTREAM_HEAD:0:9}  origin/main=${ORIGIN_HEAD:0:9}"

          if [[ "$BEFORE" == "$UPSTREAM_HEAD" && "$BEFORE" == "$ORIGIN_HEAD" ]]; then
            echo "::notice::三者一致,无需 rebase/push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="false"
          if [[ "$BEFORE" != "$UPSTREAM_HEAD" ]]; then
            if git rebase "upstream/${UPSTREAM_BRANCH}"; then
              echo "::notice::rebase 成功: ${BEFORE:0:9} → $(git rev-parse HEAD | cut -c1-9)"
              CHANGED="true"
            else
              git rebase --abort 2>/dev/null || true
              echo "::error::rebase 冲突!请本地执行 'git fetch upstream && git rebase upstream/main' 手动解决后 push。"
              exit 1
            fi
          fi
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

      # 只在 main 真的变(rebase 改写)时 push。
      - name: Push main (only if rebased)
        if: steps.rebase.outputs.changed == 'true'
        run: |
          set -uo pipefail
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/${UPSTREAM_BRANCH})" ]]; then
            echo "::notice::rebase 后 local main == origin/main,跳过 push"
            exit 0
          fi
          git push --force-with-lease="refs/remotes/origin/${UPSTREAM_BRANCH}" origin "${UPSTREAM_BRANCH}"
          echo "::notice::main 已 force-with-lease push"

      # 只推具体的新 tag,不再用 --tags 全量推。
      - name: Push new tag (only if any)
        if: steps.check_tag.outputs.new_tag != ''
        run: |
          set -uo pipefail
          NEW_TAG="${{ steps.check_tag.outputs.new_tag }}"
          echo "推送新 tag: ${NEW_TAG}"
          git push origin "refs/tags/${NEW_TAG}:refs/tags/${NEW_TAG}"
          echo "::notice::tag ${NEW_TAG} 已推送"

  build:
    name: Build Windows (${{ needs.sync.outputs.new_tag || 'force' }})
    needs: sync
    if: needs.sync.outputs.new_tag != '' || github.event.inputs.force_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CHANNEL: oss
    steps:
      - name: Pick ref to build
        id: ref
        shell: bash
        run: |
          if [[ -n "${{ needs.sync.outputs.new_tag }}" ]]; then
            echo "ref=${{ needs.sync.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Prepare environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          cache_key: x64
          is_self_hosted: false

      - name: Build binary (skip installer)
        id: build_binary
        run: script/bundle -Channel "$CHANNEL" -skip_build_installer --arch x64
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.sync.outputs.new_tag || github.sha }}

      - name: Compute artifact name + release metadata
        id: name
        shell: bash
        run: |
          NEW_TAG="${{ needs.sync.outputs.new_tag }}"
          if [[ -n "$NEW_TAG" ]]; then
            # 正式 release:对齐上游命名 "Zap v<tag>"
            ARTIFACT_NAME="zap-windows-x64-${NEW_TAG}"
            ASSET_NAME="zap-oss-${NEW_TAG}.exe"
            RELEASE_NAME="Zap ${NEW_TAG}"
            RELEASE_BODY="Windows x64 build of ${NEW_TAG} (synced from upstream ${UPSTREAM_REPO})."
            PRERELEASE="false"
          else
            # 手动 force_build:挂到 prerelease,避免污染正式 release
            SHORT_SHA="$(echo ${{ github.sha }} | cut -c1-7)"
            ARTIFACT_NAME="zap-windows-x64-manual-${SHORT_SHA}"
            ASSET_NAME="zap-oss-main-${SHORT_SHA}.exe"
            RELEASE_NAME="Zap nightly (${SHORT_SHA})"
            RELEASE_BODY="Manual force_build from main @ ${SHORT_SHA}. Not an official release."
            PRERELEASE="true"
          fi
          {
            echo "artifact_name=${ARTIFACT_NAME}"
            echo "asset_name=${ASSET_NAME}"
            echo "release_name=${RELEASE_NAME}"
            printf 'release_body<<EOF\n%s\nEOF\n' "$RELEASE_BODY"
            echo "prerelease=${PRERELEASE}"
            # tag:有新 tag 用之;force_build 用日期化的临时 tag 避免与上游冲突
            if [[ -n "$NEW_TAG" ]]; then
              echo "release_tag=${NEW_TAG}"
            else
              echo "release_tag=nightly-${SHORT_SHA}"
            fi
          } >> "$GITHUB_OUTPUT"

      # 同时留一份 workflow artifact(防止 release 步骤失败时丢产物,也方便直接下载)
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: ${{ steps.build_binary.outputs.binary_path }}
          if-no-files-found: error
          retention-days: 30

      # 重命名为最终 asset 文件名,上传到 release 用
      - name: Stage binary for release upload
        id: stage
        shell: bash
        run: |
          SRC="${{ steps.build_binary.outputs.binary_path }}"
          DST="${{ runner.temp }}/${{ steps.name.outputs.asset_name }}"
          cp "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"
          ls -la "$DST"

      # softprops/action-gh-release 幂等:release 不存在则创建,存在则只补 asset。
      # tag_exists 时它会复用,不会重写 body/tag_name。files 支持多文件。
      - name: Create/update GitHub Release + upload .exe
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.name.outputs.release_tag }}
          name: ${{ steps.name.outputs.release_name }}
          body: ${{ steps.name.outputs.release_body }}
          prerelease: ${{ steps.name.outputs.prerelease }}
          files: ${{ steps.stage.outputs.path }}
          target_commitish: ${{ github.event.repository.default_branch }}
          # fork 上不抢 "latest" 标记(避免影响 fork 网络的 metadata)。
          # 用户从 Releases 页面手动选要看哪个即可。
          make_latest: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
